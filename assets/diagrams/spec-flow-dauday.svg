<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>Các kiểu tín hiệu đầu ra</text><rect x='60' y='62' width='600' height='44' rx='7' fill='#fff' stroke='#d6deea'/><text x='80' y='90' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1c2836' text-anchor='start'>4–20mA</text><text x='230' y='90' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>tín hiệu analog, chống nhiễu tốt, đi xa</text><rect x='60' y='116' width='600' height='44' rx='7' fill='#fff' stroke='#d6deea'/><text x='80' y='144' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1c2836' text-anchor='start'>Xung / tần số</text><text x='230' y='144' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>mỗi xung = một đơn vị thể tích, dùng để cộng dồn</text><rect x='60' y='170' width='600' height='44' rx='7' fill='#fff' stroke='#d6deea'/><text x='80' y='198' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1c2836' text-anchor='start'>Modbus RTU</text><text x='230' y='198' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>đọc nhiều giá trị: lưu lượng, tổng, nhiệt độ</text><rect x='60' y='224' width='600' height='44' rx='7' fill='#fff' stroke='#d6deea'/><text x='80' y='252' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1c2836' text-anchor='start'>HART</text><text x='230' y='252' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>4–20mA kèm dữ liệu số, c