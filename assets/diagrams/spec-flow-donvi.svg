<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>Đơn vị lưu lượng thường dùng</text><rect x='60' y='56' width='600' height='36' rx='6' fill='#fff' stroke='#d6deea'/><text x='82' y='80' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1f6feb' text-anchor='start'>m³/h</text><text x='200' y='80' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>thể tích theo giờ — phổ biến nhất cho nước</text><rect x='60' y='100' width='600' height='36' rx='6' fill='#fff' stroke='#d6deea'/><text x='82' y='124' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1f6feb' text-anchor='start'>l/min</text><text x='200' y='124' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>thể tích theo phút — máy móc, dây chuyền nhỏ</text><rect x='60' y='144' width='600' height='36' rx='6' fill='#fff' stroke='#d6deea'/><text x='82' y='168' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1f6feb' text-anchor='start'>kg/h</text><text x='200' y='168' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>khối lượng theo giờ — hơi, khí, hóa chất</text><rect x='60' y='188' width='600' height='36' rx='6' fill='#fff' stroke='#d6deea'/><text x='82' y='212' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1f6feb' text-anchor='start'>Nm³/h</text><text x='200' y='212' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>thể tích khí quy về điều kiện chuẩn</text><rect x='60' y='232' width='600' height='36' rx='6' fill='#fff' stroke='#d6deea'/><text x='82' y='256' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1f6feb' text-anchor='start'>m/s</text><text x='200' y='256' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='start'>vận tốc dòng — nhân tiết diện ra lưu lượng</text><text x='360' y='278' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='700' fill='#e5484d' text-anchor='middle'>nhầm Nm³/h với m³/h là sai số rất lớn khi đo khí</text></svg>