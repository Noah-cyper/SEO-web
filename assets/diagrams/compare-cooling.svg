<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>So sánh: làm mát chất lỏng vs làm mát gió</text><rect x='60' y='80' width='280' height='150' rx='9' fill='#eef6f6' stroke='#0e8f8f' stroke-width='2'/><text x='200' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#0e8f8f' text-anchor='middle'>Làm mát chất lỏng</text><text x='80' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chênh nhiệt cell thấp</text><text x='80' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Hợp mật độ cao, C-rate cao</text><text x='80' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Pin bền hơn, ổn định hơn</text><text x='80' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#0e8f8f' text-anchor='start'>→ tủ/container hiện đại</text><rect x='380' y='80' width='280' height='150' rx='9' fill='#eef3fb' stroke='#1f6feb' stroke-width='2'/><text x='520' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f6feb' text-anchor='middle'>Làm mát bằng gió</text><text x='400' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Cấu tạo đơn giản, rẻ hơn</text><text x='400' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Bảo trì dễ</text><text x='400' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chênh nhiệt lớn hơn</text><text x='400' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#1f6feb' text-anchor='start'>→ hệ nhỏ, tải nhẹ</text></svg>