<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 270' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='268' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>Các phần tử BPMN dùng trong workflow sản xuất</text><rect x='25' y='105' width='128' height='74' rx='9' fill='#fff' stroke='#12a06a' stroke-width='2'/><text x='89.0' y='139.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#1c2836' text-anchor='middle'>Start event</text><text x='89.0' y='158.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>sự kiện kích hoạt</text><rect x='163' y='105' width='128' height='74' rx='9' fill='#fff' stroke='#6E56CF' stroke-width='2'/><text x='227.0' y='139.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#1c2836' text-anchor='middle'>Service task</text><text x='227.0' y='158.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>gọi API, ghi dữ liệu</text><rect x='301' y='105' width='128' height='74' rx='9' fill='#fff' stroke='#d9862a' stroke-width='2'/><text x='365.0' y='139.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#1c2836' text-anchor='middle'>Gateway</text><text x='365.0' y='158.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>rẽ nhánh điều kiện</text><rect x='439' y='105' width='128' height='74' rx='9' fill='#fff' stroke='#1f6feb' stroke-width='2'/><text x='503.0' y='139.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#1c2836' text-anchor='middle'>User task</text><text x='503.0' y='158.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>người xác nhận</text><rect x='577' y='105' width='128' height='74' rx='9' fill='#fff' stroke='#e5484d' stroke-width='2'/><text x='641.0' y='139.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#1c2836' text-anchor='middle'>End event</text><text x='641.0' y='158.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>kết thúc, ghi vết</text><text x='25' y='215' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#5a6b80' text-anchor='start'>Lưu đồ có thể chạy được: người vận hành đọc hiểu, kỹ sư sửa trên giao diện,</text><text x='25' y='240' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#5a6b80' text-anchor='start'>không phải dừng dây chuyền để sửa logic trong PLC.</text></svg>