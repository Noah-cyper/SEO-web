<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>So sánh: khởi động sao–tam giác và biến tần</text><rect x='60' y='80' width='280' height='150' rx='9' fill='#fdf0e0' stroke='#d9862a' stroke-width='2'/><text x='200' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#d9862a' text-anchor='middle'>Khởi động sao–tam giác</text><text x='80' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Rẻ, đơn giản</text><text x='80' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Vẫn có cú giật khi chuyển</text><text x='80' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chỉ có 1 tốc độ chạy</text><text x='80' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#d9862a' text-anchor='start'>→ tải đơn giản, ít khởi động</text><rect x='380' y='80' width='280' height='150' rx='9' fill='#e8f5ee' stroke='#12a06a' stroke-width='2'/><text x='520' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#12a06a' text-anchor='middle'>Biến tần</text><text x='400' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Khởi động êm, không giật</text><text x='400' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Đổi tốc độ tuỳ ý, tiết kiệm điện</text><text x='400' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Bảo vệ động cơ tốt hơn</text><text x='400' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#12a06a' text-anchor='start'>→ bơm, quạt, dây chuyền</text></svg>