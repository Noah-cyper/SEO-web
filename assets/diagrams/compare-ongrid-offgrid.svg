<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>So sánh: hệ nối lưới vs hệ độc lập</text><rect x='60' y='80' width='280' height='150' rx='9' fill='#eef3fb' stroke='#1f6feb' stroke-width='2'/><text x='200' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#1f6feb' text-anchor='middle'>Nối lưới (on-grid)</text><text x='80' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Cắt đỉnh, dịch tải, mua rẻ</text><text x='80' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Vẫn dùng lưới làm dự phòng</text><text x='80' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Cần tuân thủ đấu nối</text><text x='80' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#1f6feb' text-anchor='start'>→ nhà máy, toà nhà</text><rect x='380' y='80' width='280' height='150' rx='9' fill='#e8f5ee' stroke='#0f9d58' stroke-width='2'/><text x='520' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#0f9d58' text-anchor='middle'>Độc lập (off-grid)</text><text x='400' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Tự cấp điện hoàn toàn</text><text x='400' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Cần dự phòng lớn hơn</text><text x='400' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Thường kèm PV + máy phát</text><text x='400' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#0f9d58' text-anchor='start'>→ đảo, trạm xa lưới</text></svg>