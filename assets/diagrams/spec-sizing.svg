<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>Cấu tạo bài toán: công suất · dung lượng · C-rate</text><rect x='60' y='95' width='150' height='80' rx='9' fill='#fdf0e0' stroke='#d9862a' stroke-width='2'/><text x='135.0' y='132.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#1c2836' text-anchor='middle'>Công suất (kW)</text><text x='135.0' y='150.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>tải đỉnh cần bù</text><rect x='285' y='95' width='150' height='80' rx='9' fill='#e8f5ee' stroke='#0f9d58' stroke-width='2'/><text x='360.0' y='132.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#1c2836' text-anchor='middle'>Dung lượng (kWh)</text><text x='360.0' y='150.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>kW × số giờ</text><rect x='510' y='95' width='150' height='80' rx='9' fill='#eef4fc' stroke='#1f6feb' stroke-width='2'/><text x='585.0' y='132.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#1c2836' text-anchor='middle'>C-rate</text><text x='585.0' y='150.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>kW ÷ kWh</text><text x='360' y='215' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1c2836' text-anchor='middle'>Ví dụ: cắt đỉnh 100 kW trong 2 giờ → cần ≈ 200 kWh (0,5C)</text><text x='360' y='245' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='400' fill='#5a6b80' text-anchor='middle'>Chọn dư 10–20% cho tổn hao, DoD 