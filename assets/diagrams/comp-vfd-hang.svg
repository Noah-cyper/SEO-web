<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>So sánh: tiêu chí chọn hãng biến tần</text><rect x='60' y='70' width='600' height='160' rx='10' fill='#fff' stroke='#1f6feb' stroke-width='2'/><text x='360' y='92' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1f6feb' text-anchor='middle'>Tiêu chí so sánh khi chọn hãng biến tần</text><text x='85' y='120' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Sẵn hàng & thời gian giao</text><text x='85' y='146' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Có phụ tùng thay thế lâu dài</text><text x='85' y='172' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Hỗ trợ kỹ thuật tiếng Việt</text><text x='85' y='198' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Tài liệu & phần mềm dễ tìm</text><text x='390' y='120' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Dải công suất phù hợp</text><text x='390' y='146' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Tính năng cần (PID, Modbus…)</text><text x='390' y='172' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chính sách bảo hành</text><text x='390' y='198' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Tổng chi phí sở hữu, không chỉ giá mua</text><text x='360' y='258' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#5a6b80' text-anchor='middle'>Hãng tốt nhất là hãng bạn mua được phụ tùng sau 5 năm</text></svg>