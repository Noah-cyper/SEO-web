<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>So sánh: các nguồn hoàn vốn khi đầu tư BESS</text><text x='70' y='80' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='13' font-weight='700' fill='#1c2836' text-anchor='start'>Nguồn hoàn vốn của hệ BESS</text><rect x='60' y='105' width='190' height='55' rx='9' fill='#fdf0e0' stroke='#d9862a' stroke-width='2'/><text x='155.0' y='129.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='700' fill='#1c2836' text-anchor='middle'>Chênh giá giờ</text><text x='155.0' y='147.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>cao điểm ↔ thấp điểm</text><rect x='265' y='105' width='190' height='55' rx='9' fill='#e8f5ee' stroke='#0f9d58' stroke-width='2'/><text x='360.0' y='129.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='700' fill='#1c2836' text-anchor='middle'>Giảm công suất đỉnh</text><text x='360.0' y='147.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>hạ phí công suất</text><rect x='470' y='105' width='190' height='55' rx='9' fill='#eef3fb' stroke='#1f6feb' stroke-width='2'/><text x='565.0' y='129.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='700' fill='#1c2836' text-anchor='middle'>Tự dùng điện PV</text><text x='565.0' y='147.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>bớt mua điện lưới</text><rect x='60' y='175' width='190' height='55' rx='9' fill='#fdeede' stroke='#e5484d' stroke-width='2'/><text x='155.0' y='199.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='700' fill='#1c2836' text-anchor='middle'>Tránh dừng SX</text><text x='155.0' y='217.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>khi mất điện</text><rect x='265' y='175' width='190' height='55' rx='9' fill='#eef6f6' stroke='#0e8f8f' stroke-width='2'/><text x='360.0' y='199.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='700' fill='#1c2836' text-anchor='middle'>Trì hoãn nâng cấp</text><text x='360.0' y='217.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>máy biến áp/đường dây</text><rect x='470' y='175' width='190' height='55' rx='9' fill='#eef4fc' stroke='#6b4fd8' stroke-width='2'/><text x='565.0' y='199.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='700' fill='#1c2836' text-anchor='middle'>Chứng chỉ xanh</text><text x='565.0' y='217.5' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='400' fill='#5a6b80' text-anchor='middle'>ESG · giảm phát thải</text><text x='360' y='262' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#5a6b80' text-anchor='middle'>Tính hoàn vốn nên cộng đủ các nguồn, không chỉ chênh giá điện</text></svg>