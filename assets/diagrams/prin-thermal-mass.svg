ext><path d='M316 130 q6 -9 0 -18' fill='none' stroke='#e5484d' stroke-width='1.6'/><path d='M324 130 q6 -9 0 -18' fill='none' stroke='#e5484d' stroke-width='1.6'/><path d='M332 130 q6 -9 0 -18' fill='none' stroke='#e5484d' stroke-width='1.6'/><text x='360' y='208' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#1c2836' text-anchor='middle'>khí chảy qua mang nhiệt đi — càng nhiều khí, càng mất nhiệt nhanh</text><text x='360' y='234' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#12a06a' text-anchor='middle'>đo công suất cần để giữ chênh nhiệt ⇒ ra lưu lượng khối</text><text x='360' y='260' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11' font-weight='700' fill='#e5484d' text-anchor='middle'>kết quả phụ thuộc thành phần khí — phải khai đúng loại khí</text></svg>