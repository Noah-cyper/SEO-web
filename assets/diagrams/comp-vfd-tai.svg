<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>So sánh: chọn biến tần theo loại tải</text><rect x='60' y='80' width='280' height='150' rx='9' fill='#eef6f6' stroke='#0e8f8f' stroke-width='2'/><text x='200' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#0e8f8f' text-anchor='middle'>Tải bậc ba (bơm · quạt)</text><text x='80' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Mô-men tăng theo tốc độ²</text><text x='80' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chọn biến tần dòng tiêu chuẩn</text><text x='80' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Tiết kiệm điện rất lớn</text><text x='80' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#0e8f8f' text-anchor='start'>→ chọn đúng công suất là đủ</text><rect x='380' y='80' width='280' height='150' rx='9' fill='#fdf0e0' stroke='#d9862a' stroke-width='2'/><text x='520' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='13.5' font-weight='700' fill='#d9862a' text-anchor='middle'>Mô-men không đổi</text><text x='400' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Băng tải, máy ép, nâng hạ</text><text x='400' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Cần mô-men cao khi khởi động</text><text x='400' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Nên chọn dư 1 cấp công suất</text><text x='400' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#d9862a' text-anchor='start'>→ ưu tiên chế độ vector</text></svg>