<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>So sánh: BESS vs máy phát điện dự phòng</text><rect x='60' y='80' width='280' height='150' rx='9' fill='#e8f5ee' stroke='#0f9d58' stroke-width='2'/><text x='200' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#0f9d58' text-anchor='middle'>BESS</text><text x='80' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chuyển tải gần như tức thì</text><text x='80' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Không khói, không ồn</text><text x='80' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Còn kiếm tiền lúc bình thường</text><text x='80' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#0f9d58' text-anchor='start'>→ tải nhạy, đô thị</text><rect x='380' y='80' width='280' height='150' rx='9' fill='#fdf0e0' stroke='#d9862a' stroke-width='2'/><text x='520' y='105' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#d9862a' text-anchor='middle'>Máy phát diesel</text><text x='400' y='135' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chạy dài ngày nếu đủ dầu</text><text x='400' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Đầu tư ban đầu thấp hơn</text><text x='400' y='185' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Có trễ khởi động, ồn, khói</text><text x='400' y='210' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#d9862a' text-anchor='start'>→ dự phòng dài hạn</text></svg>