<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>Cấu tạo bộ thông số cơ bản của biến tần</text><rect x='150' y='60' width='420' height='180' rx='10' fill='#fff' stroke='#1f6feb' stroke-width='2.5'/><text x='360' y='82' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12.5' font-weight='700' fill='#1f6feb' text-anchor='middle'>Nhóm thông số cần cài đầu tiên</text><text x='175' y='110' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Thông số động cơ: U, I, f, tốc độ, cosφ</text><text x='175' y='136' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Nguồn lệnh chạy: bàn phím · terminal · Modbus</text><text x='175' y='162' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Nguồn đặt tần số: biến trở · AI · truyền thông</text><text x='175' y='188' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Thời gian tăng tốc / giảm tốc (ACC/DEC)</text><text x='175' y='214' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Giới hạn tần số min/max · bảo vệ quá tải</text><text x='360' y='266' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#5a6b80' text-anchor='middle'>Cài đúng thông số động cơ trước — sai ở đây gây lỗi về sau</text></svg>