<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 740 235' width='100%' height='auto' role='img'><rect x='1' y='1' width='738' height='233' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>Pt100 vs Can nhiệt</text><rect x='40' y='60' width='300' height='150' rx='9' fill='#fff' stroke='#1f6feb' stroke-width='2'/><text x='190.0' y='140.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#1c2836' text-anchor='middle'>Pt100 (RTD)</text><text x='60' y='100' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chính xác, ổn định</text><text x='60' y='125' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Dải ~ -200…600°C</text><text x='60' y='150' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Đấu 2 / 3 / 4 dây</text><text x='60' y='175' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#12a06a' text-anchor='start'>→ cần độ chính xác cao</text><rect x='400' y='60' width='300' height='150' rx='9' fill='#fff' stroke='#d9862a' stroke-width='2'/><text x='550.0' y='140.0' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='14' font-weight='700' fill='#1c2836' text-anchor='middle'>Can nhiệt (TC)</text><text x='420' y='100' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Chịu nhiệt rất cao</text><text x='420' y='125' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Tới ~1200°C+ (K,S)</text><text x='420' y='150' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#1c2836' text-anchor='start'>• Bền, giá tốt</text><text x='420' y='175' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='11.5' font-weight='700' fill='#d9862a' text-anchor='start'>→ cần nhiệt độ cực cao</text></svg>