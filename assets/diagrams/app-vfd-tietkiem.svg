<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='100%' height='auto' role='img'><rect x='1' y='1' width='718' height='288' rx='14' fill='#f6f8fb' stroke='#d6deea'/><text x='20' y='30' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='16' font-weight='700' fill='#1c2836'>Ứng dụng: tiết kiệm điện so với van tiết lưu</text><text x='120' y='75' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#e5484d' text-anchor='start'>Van tiết lưu (cũ)</text><text x='430' y='75' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='700' fill='#12a06a' text-anchor='start'>Biến tần (mới)</text><rect x='120' y='90' width='190' height='120' rx='8' fill='#fdeede' stroke='#e5484d'/><rect x='140' y='190' width='150' height='0' fill='#e5484d'/><rect x='150' y='110' width='130' height='85' rx='4' fill='#e5484d' opacity='0.35'/><text x='215' y='160' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='13' font-weight='700' fill='#1c2836' text-anchor='middle'>100% điện</text><text x='215' y='182' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='10.5' font-weight='400' fill='#5a6b80' text-anchor='middle'>bóp van, phí năng lượng</text><rect x='430' y='90' width='190' height='120' rx='8' fill='#e8f5ee' stroke='#12a06a'/><rect x='460' y='152' width='130' height='43' rx='4' fill='#12a06a' opacity='0.45'/><text x='525' y='145' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='13' font-weight='700' fill='#1c2836' text-anchor='middle'>≈51% điện</text><text x='525' y='182' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='10.5' font-weight='400' fill='#5a6b80' text-anchor='middle'>giảm tốc 20% theo P ∝ n³</text><text x='360' y='250' font-family='Segoe UI,Roboto,Arial,sans-serif' font-size='12' font-weight='400' fill='#5a6b80' text-anchor='middle'>Cùng một mức lưu lượng, cách điều khiển quyết định hoá đơn điện</text></svg>